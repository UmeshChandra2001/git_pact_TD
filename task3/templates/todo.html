<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add To-Do Item</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        form { background: white; padding: 20px; border-radius: 8px; width: 350px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { display: block; width: 100%; margin-bottom: 15px; padding: 8px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>Create a New To-Do Item</h2>

    <!-- To-Do Form submitting to backend route -->
    <form action="/submittodoitem" method="POST">
        <label>Item Name:</label>
        <input type="text" name="itemName" required>
        
        <label>Item Description:</label>
        <textarea name="itemDescription" rows="4" required></textarea>
        
        <button type="submit">Submit Item</button>
    </form>

</body>
</html>
